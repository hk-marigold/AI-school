<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おべんきょうアプリ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    /* テーマ色（きせかえでJSが書きかえる） */
    --bg: linear-gradient(160deg, #f3e8ff 0%, #ffe9f3 45%, #fff5f0 100%);
    --accA: #c084d9;
    --accB: #f778a8;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    background-attachment: fixed;
    color: #4a4453;
    user-select: none;
    touch-action: manipulation;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 920px; margin: 0 auto; padding: 26px 22px 40px; min-height: 100vh; }

  /* ヘッダー */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 26px;
  }
  .topleft { display: flex; align-items: center; gap: 14px; }
  .brand { line-height: 1.1; }
  .brand .en {
    font-size: 15px; letter-spacing: 5px; text-transform: uppercase;
    color: #c9a2d4; font-weight: 600;
  }
  .title {
    font-size: 32px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accA), var(--accB));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-top: 2px;
  }
  .stars {
    background: rgba(255,255,255,.75); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 999px; padding: 10px 20px;
    font-size: 20px; font-weight: 700; color: #e0669a;
    box-shadow: 0 8px 22px rgba(200,120,180,.20);
  }
  #points.pop { animation: pointPop .45s ease; }
  @keyframes pointPop {
    0% { transform: scale(1); }
    35% { transform: scale(1.28); color: #ff8fab; }
    100% { transform: scale(1); }
  }

  /* ホーム：教科ボタン */
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    margin-top: 6px;
  }
  .subject {
    position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,.6); border-radius: 26px;
    padding: 26px 14px 22px;
    font-size: 21px; font-weight: 700; letter-spacing: 1px; color: #fff;
    cursor: pointer; text-align: center;
    box-shadow: 0 14px 30px rgba(150,110,170,.22);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .subject:active { transform: translateY(3px) scale(.99); box-shadow: 0 8px 18px rgba(150,110,170,.22); }
  .subject .emoji {
    display: flex; align-items: center; justify-content: center;
    width: 58px; height: 58px; margin: 0 auto 12px;
    background: rgba(255,255,255,.28); border-radius: 18px;
    font-size: 30px;
  }
  .subject .sub { display:block; font-size: 11px; letter-spacing: 3px; opacity: .85; font-weight: 600; margin-top: 3px; }
  .s-math    { background: linear-gradient(150deg, #ffb37e, #ff8fab); }
  .s-kanji   { background: linear-gradient(150deg, #ff9ac1, #e26aa0); }
  .s-english { background: linear-gradient(150deg, #8fd3ff, #6aa8f0); }
  .s-society { background: linear-gradient(150deg, #8ee6c0, #4fc79a); }
  .s-science { background: linear-gradient(150deg, #c4a8ff, #9b7bf0); }
  .s-mix     { background: linear-gradient(150deg, #f7b6e0, #c084d9); }
  .home-msg { text-align: center; font-size: 15px; color: #b09bbd; margin: 28px 0 10px; letter-spacing: 1px; }

  /* レベルカード */
  .levelcard {
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.9); border-radius: 26px;
    padding: 18px 22px; margin-bottom: 20px;
    box-shadow: 0 14px 34px rgba(170,130,190,.16);
    display: flex; align-items: center; gap: 16px;
  }
  .levelcard .lv-emoji {
    width: 60px; height: 60px; flex: 0 0 60px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    background: linear-gradient(150deg, var(--accA), var(--accB));
  }
  .levelcard .lv-info { flex: 1; min-width: 0; }
  .lv-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .lv-num { font-size: 15px; font-weight: 700; color: #a568bf; letter-spacing: 1px; }
  .lv-name { font-size: 20px; font-weight: 700; color: #5a4f63; }
  .lv-pts { margin-left: auto; font-size: 15px; font-weight: 700; color: #e0669a; white-space: nowrap; }
  .lv-bar { height: 12px; background: rgba(200,170,210,.22); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .lv-bar > div { height: 100%; background: linear-gradient(90deg,var(--accA),var(--accB)); width: 0%; transition: width .5s; }
  .lv-next { font-size: 12px; color: #b09bbd; margin-top: 6px; letter-spacing: .5px; }

  /* きせかえ */
  .theme-title { font-size: 14px; font-weight: 700; color: #a568bf; letter-spacing: 2px; margin: 26px 0 12px; text-align: center; }
  .themes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .theme {
    width: 78px; border: 2px solid transparent; border-radius: 20px; padding: 8px 6px 10px;
    background: rgba(255,255,255,.7); cursor: pointer; text-align: center;
    box-shadow: 0 8px 20px rgba(170,130,190,.14);
  }
  .theme .swatch { height: 40px; border-radius: 14px; margin-bottom: 6px; }
  .theme .t-name { font-size: 12px; font-weight: 700; color: #6b5d6f; }
  .theme.selected { border-color: var(--accB); }
  .theme.locked { cursor: default; }
  .theme.locked .swatch { filter: grayscale(.7) opacity(.5); }
  .theme.locked .t-name { color: #b3a6bd; }
  .theme .t-lock { font-size: 11px; color: #c49bb5; font-weight: 700; }

  /* カード共通 */
  .card {
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.9); border-radius: 28px;
    box-shadow: 0 16px 40px rgba(170,130,190,.16);
  }

  /* クイズ画面 */
  .quiz-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .back {
    border: 1px solid rgba(255,255,255,.9); background: rgba(255,255,255,.7);
    border-radius: 999px; padding: 10px 20px;
    font-size: 15px; font-weight: 700; cursor: pointer; color: #a07bb5;
    box-shadow: 0 6px 16px rgba(170,130,190,.16);
  }
  .quiz-title { font-weight: 700; font-size: 19px; letter-spacing: 2px; color: #a568bf; }
  .progress {
    height: 12px; background: rgba(255,255,255,.7); border-radius: 999px; overflow: hidden;
    margin: 16px 0 24px; box-shadow: inset 0 1px 3px rgba(160,120,180,.12);
  }
  .progress > div { height: 100%; background: linear-gradient(90deg,var(--accB),var(--accA)); width: 0%; transition: width .35s; }

  .question {
    padding: 40px 22px; text-align: center;
    font-size: 38px; font-weight: 700; margin-bottom: 22px; color: #5a4f63;
    min-height: 100px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.9); border-radius: 28px;
    box-shadow: 0 16px 40px rgba(170,130,190,.16);
  }
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .choice {
    border: 1px solid rgba(255,255,255,.9); border-radius: 22px;
    padding: 24px 12px; font-size: 26px; font-weight: 700;
    background: rgba(255,255,255,.85); color: #5a4f63; cursor: pointer;
    box-shadow: 0 10px 24px rgba(170,130,190,.14);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .choice:active { transform: translateY(2px); }
  .choice.correct { background: linear-gradient(150deg,#8ee6c0,#4fc79a); color: #fff; border-color: transparent; box-shadow: 0 10px 26px rgba(80,190,150,.4); }
  .choice.wrong   { background: linear-gradient(150deg,#ffb0b0,#ff8f9c); color: #fff; border-color: transparent; box-shadow: 0 10px 26px rgba(240,120,140,.4); }
  .choice.dim { opacity: .4; }

  /* フィードバック */
  .feedback {
    text-align: center; font-size: 26px; font-weight: 700; margin-top: 24px;
    min-height: 40px; letter-spacing: 1px;
  }
  .fb-ok { color: #34b389; }
  .fb-ng { color: #e6799b; }
  .explain {
    margin: 16px auto 0; max-width: 640px;
    background: linear-gradient(150deg, rgba(255,249,230,.95), rgba(255,240,246,.95));
    border: 1px solid rgba(255,220,150,.6); border-radius: 22px;
    padding: 18px 22px; font-size: 19px; line-height: 1.6; color: #6b5d4f;
    box-shadow: 0 10px 26px rgba(200,170,120,.18);
  }
  .explain-head { display: block; font-size: 15px; font-weight: 700; color: #e8a13c; margin-bottom: 6px; letter-spacing: 1px; }
  .next {
    display: block; margin: 20px auto 0; border: none; border-radius: 999px;
    padding: 18px 52px; font-size: 21px; font-weight: 700; letter-spacing: 2px; color: #fff;
    background: linear-gradient(90deg,var(--accB),var(--accA)); cursor: pointer;
    box-shadow: 0 12px 28px rgba(200,120,200,.4);
    transition: transform .1s ease;
  }
  .next:active { transform: translateY(2px); }
  .hidden { display: none !important; }

  /* おわり画面 */
  .result {
    text-align: center; padding: 48px 24px;
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.9); border-radius: 28px;
    box-shadow: 0 16px 40px rgba(170,130,190,.16);
  }
  .result .big { font-size: 76px; margin: 6px 0; }
  .bonus-box {
    background: linear-gradient(150deg, rgba(255,249,230,.95), rgba(255,240,246,.95));
    border: 1px solid rgba(255,220,150,.7); border-radius: 18px;
    padding: 12px 18px; margin: 10px auto 0; max-width: 520px;
    font-size: 17px; color: #6b5d4f; line-height: 1.5;
  }
  .bonus-box b { color: #e0669a; }
  .result .msg {
    font-size: 26px; font-weight: 700; letter-spacing: 1px; margin: 12px 0 20px;
    background: linear-gradient(90deg,var(--accA),var(--accB));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* PC表示：スクロールせず「つぎへ」まで見えるよう高さを詰める */
  @media (min-width: 700px) {
    #app { padding-top: 16px; padding-bottom: 24px; }
    .progress { margin: 12px 0 16px; }
    .question {
      padding: 22px; min-height: 64px; font-size: 34px; margin-bottom: 14px;
    }
    .choices { gap: 12px; }
    .choice { padding: 16px 12px; font-size: 24px; }
    .feedback { margin-top: 14px; font-size: 24px; min-height: 32px; }
    .explain { margin-top: 12px; padding: 14px 20px; font-size: 18px; line-height: 1.5; }
    .next { margin-top: 12px; padding: 14px 48px; }
  }
</style>

<div id="app">
  <div class="top">
    <div class="topleft">
      <button class="back hidden" id="topBack" onclick="goHome()">← ホーム</button>
      <div class="brand">
        <div class="en">Study Time</div>
        <div class="title">スタディ</div>
      </div>
    </div>
    <div class="stars" id="points">🌸 <span id="pointCount">0</span> pt</div>
  </div>

  <!-- ホーム -->
  <div id="home">
    <div class="levelcard">
      <div class="lv-emoji" id="lvEmoji">🌱</div>
      <div class="lv-info">
        <div class="lv-line">
          <span class="lv-num" id="lvNum">Lv.1</span>
          <span class="lv-name" id="lvName">たね</span>
          <span class="lv-pts" id="lvPts">🌸 0 pt</span>
        </div>
        <div class="lv-bar"><div id="lvBar"></div></div>
        <div class="lv-next" id="lvNext"></div>
      </div>
    </div>
    <div class="grid">
      <button class="subject s-math"    onclick="startQuiz('math')"><span class="emoji">🧮</span>算数<span class="sub">MATH</span></button>
      <button class="subject s-kanji"   onclick="startQuiz('kanji')"><span class="emoji">🖋️</span>漢字<span class="sub">KANJI</span></button>
      <button class="subject s-english" onclick="startQuiz('english')"><span class="emoji">🔠</span>英語<span class="sub">ENGLISH</span></button>
      <button class="subject s-society" onclick="startQuiz('society')"><span class="emoji">🌏</span>社会<span class="sub">SOCIAL</span></button>
      <button class="subject s-science" onclick="startQuiz('science')"><span class="emoji">🔬</span>理科<span class="sub">SCIENCE</span></button>
    </div>
    <div class="theme-title">🎨 きせかえ（ポイントでふえるよ）</div>
    <div class="themes" id="themes"></div>
    <div class="home-msg">すきな教科をえらんでね ♡</div>
  </div>

  <!-- クイズ -->
  <div id="quiz" class="hidden">
    <div class="quiz-head">
      <div class="quiz-title" id="quizTitle"></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain hidden" id="explain"><span class="explain-head">💡 かいせつ</span><span id="explainText"></span></div>
    <button class="next hidden" id="nextBtn" onclick="nextQuestion()">つぎへ →</button>
  </div>

  <!-- おわり -->
  <div id="end" class="hidden">
    <div class="result">
      <div class="big" id="endEmoji">🎉</div>
      <div class="msg" id="endMsg"></div>
      <div style="font-size:20px;color:#7a6f80;font-weight:700" id="endStars"></div>
      <div id="endBonus" style="margin-top:14px"></div>
      <button class="next" style="margin-top:24px" onclick="goHome()">ホームへ</button>
    </div>
  </div>
</div>

<script>
/* ===== データ ===== */

// かん字：[漢字, 読み, かいせつ]
const KANJI = [
  ["山","やま","たかく もりあがった土地。「山（やま）にのぼる」"],
  ["川","かわ","水がながれる みち。「川（かわ）であそぶ」"],
  ["花","はな","くさや木にさく はな。「花（はな）がさく」"],
  ["空","そら","頭の上にひろがる そら。「空（そら）は青い」"],
  ["月","つき","夜に光る つき。「月（つき）がでる」"],
  ["犬","いぬ","「ワン」となく どうぶつ。「犬（いぬ）とさんぽ」"],
  ["雨","あめ","空からふる みず。「雨（あめ）がふる」"],
  ["音","おと","耳できこえる おと。「音（おと）がする」"],
  ["草","くさ","地面にはえる みどりの くさ。「草（くさ）むしり」"],
  ["星","ほし","夜空に光る ほし。「星（ほし）がきらきら」"],
  ["海","うみ","しおからい 大きな水。「海（うみ）でおよぐ」"],
  ["雪","ゆき","冬にふる白い ゆき。「雪（ゆき）だるま」"],
  ["風","かぜ","ふいてくる かぜ。「風（かぜ）がつよい」"],
  ["森","もり","木がたくさんある もり。「森（もり）のなか」"],
  ["虫","むし","小さな いきもの。「虫（むし）とり」"],
  ["家","いえ","人がすむ いえ。「家（いえ）にかえる」"],
  ["魚","さかな","水のなかを およぐ さかな。「魚（さかな）つり」"],
  ["鳥","とり","空をとぶ とり。「鳥（とり）がとぶ」"],
  ["馬","うま","はやく走る大きな どうぶつ。「馬（うま）にのる」"],
  ["顔","かお","体の一番上にある かお。「顔（かお）をあらう」"],
  ["体","からだ","自分の からだ ぜんたい。「体（からだ）をうごかす」"],
  ["名前","なまえ","自分や物の よびかた。「名前（なまえ）をかく」"],
  ["道","みち","人や車がとおる みち。「道（みち）をあるく」"],
  ["店","みせ","品物をうる みせ。「店（みせ）でかいもの」"],
  ["木","き","地面にはえる き。「木（き）にのぼる」"],
  ["火","ひ","あつくてもえる ひ。「火（ひ）であたためる」"],
  ["水","みず","のんだり あらったりする みず。「水（みず）をのむ」"],
  ["土","つち","地面の つち。「土（つち）をほる」"],
  ["石","いし","かたい いし。「石（いし）をひろう」"],
  ["竹","たけ","まっすぐのびる たけ。「竹（たけ）やぶ」"],
  ["糸","いと","ほそくて長い いと。「糸（いと）でぬう」"],
  ["貝","かい","海にいる かい。「貝（かい）がら」"],
  ["車","くるま","タイヤで走る くるま。「車（くるま）にのる」"],
  ["手","て","体の て。「手（て）をあらう」"],
  ["足","あし","歩くときつかう あし。「足（あし）ではしる」"],
  ["目","め","ものを見る め。「目（め）で見る」"],
  ["耳","みみ","音をきく みみ。「耳（みみ）できく」"],
  ["口","くち","話したり食べたりする くち。「口（くち）をあける」"],
  ["田","た","米をつくる た。「田（た）んぼ」"],
  ["光","ひかり","まぶしい ひかり。「光（ひかり）がさす」"],
  ["林","はやし","木がならぶ はやし。「林（はやし）の中」"],
  ["白","しろ","ゆきのような しろ。「白（しろ）い雲」"],
  ["赤","あか","りんごのような あか。「赤（あか）いふうせん」"],
  ["青","あお","空のような あお。「青（あお）いうみ」"],
  ["朝食","ちょうしょく","朝ごはんのこと。「朝食（ちょうしょく）を食べる」"],
  ["夕食","ゆうしょく","夜のごはん。「夕食（ゆうしょく）を作る」"],
  ["昼食","ちゅうしょく","昼のごはん。「昼食（ちゅうしょく）の時間」"],
  ["教室","きょうしつ","勉強をする部屋。「教室（きょうしつ）に入る」"],
  ["黒板","こくばん","字を書く黒い板。「黒板（こくばん）に書く」"],
  ["給食","きゅうしょく","学校で出るごはん。「給食（きゅうしょく）を食べる」"],
  ["宿題","しゅくだい","家でやる勉強。「宿題（しゅくだい）を出す」"],
  ["遠足","えんそく","みんなで出かける行事。「遠足（えんそく）に行く」"],
  ["運動","うんどう","体を動かすこと。「運動（うんどう）をする」"],

  ["完成","かんせい","出来上がること。「作品が完成（かんせい）する」"],

  ["表現","ひょうげん","言葉や絵で表すこと。「気もちを表現（ひょうげん）する」"],
  ["想像","そうぞう","頭の中で思いえがくこと。「未来を想像（そうぞう）する」"],
  ["記憶","きおく","おぼえていること。「記憶（きおく）に残る」"],
  ["集中","しゅうちゅう","一つに気もちを向けること。「集中（しゅうちゅう）する」"],
  ["努力","どりょく","がんばること。「努力（どりょく）を続ける」"],
  ["成長","せいちょう","大きく育つこと。「成長（せいちょう）する」"],
  ["健康","けんこう","体が元気なこと。「健康（けんこう）に気をつける」"],
  ["病気","びょうき","体の具合が悪いこと。「病気（びょうき）を治す」"],
  ["体温","たいおん","体のあたたかさ。「体温（たいおん）を計る」"],
  ["血液","けつえき","体を流れる血。「血液（けつえき）が流れる」"],
  ["呼吸","こきゅう","息をすること。「深呼吸（しんこきゅう）する」"],

/* ===== しくみ ===== */
const SUBJECTS = {

const LEVELS = [

// きせかえテーマ（costポイントたまると使える）
const THEMES = [
  {id:"sakura",  name:"さくら",     cost:0,   bg:"linear-gradient(160deg,#f3e8ff 0%,#ffe9f3 45%,#fff5f0 100%)", a:"#c084d9", b:"#f778a8", sw:"linear-gradient(135deg,#f3e8ff,#f778a8)"},
  {id:"mint",    name:"ミント",     cost:30,  bg:"linear-gradient(160deg,#e3fbf0 0%,#e6f6ff 55%,#f5fffb 100%)", a:"#4fc79a", b:"#6aa8f0", sw:"linear-gradient(135deg,#8ee6c0,#6aa8f0)"},
  {id:"lavender",name:"ラベンダー", cost:80,  bg:"linear-gradient(160deg,#efe6ff 0%,#f6e9ff 50%,#fdf3ff 100%)", a:"#9b7bf0", b:"#c084d9", sw:"linear-gradient(135deg,#c4a8ff,#9b7bf0)"},

  {id:"ocean",   name:"オーシャン", cost:230, bg:"linear-gradient(160deg,#e2f0ff 0%,#e9f7ff 55%,#f3fbff 100%)", a:"#4dabf7", b:"#7c9bf0", sw:"linear-gradient(135deg,#8fd3ff,#6aa8f0)"},

let points = Number(localStorage.getItem("benkyo_points") || 0);
let currentTheme = localStorage.getItem("benkyo_theme") || "sakura";
let quizList = [];
let idx = 0;
let gotThisSession = 0;   // 正解した数
let pointStart = 0;       // クイズ開始時のポイント（レベルアップ判定用）

function levelOf(p){
  let lv = LEVELS[0], i = 0;
  for(let k=0;k<LEVELS.length;k++){ if(p>=LEVELS[k].min){ lv=LEVELS[k]; i=k; } }
  return {lv, index:i, next: LEVELS[i+1] || null};
}

// テーマを画面に反映
function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  document.documentElement.style.setProperty("--bg", t.bg);
  document.documentElement.style.setProperty("--accA", t.a);
  document.documentElement.style.setProperty("--accB", t.b);
}

// 着せ替えを選ぶ（ポイントが足りていれば）
function selectTheme(id){
  const t = THEMES.find(x=>x.id===id);
  if(!t || points < t.cost) return;
  currentTheme = id;
  localStorage.setItem("benkyo_theme", id);
  applyTheme(id);
  renderThemes();
}

// きせかえ一覧を描く
function renderThemes(){
  const box = document.getElementById("themes");
  box.innerHTML = "";
  THEMES.forEach(t=>{
    const unlocked = points >= t.cost;
    const el = document.createElement("div");
    el.className = "theme" + (currentTheme===t.id ? " selected":"") + (unlocked?"":" locked");
    el.innerHTML = `<div class="swatch" style="background:${t.sw}"></div>`
      + `<div class="t-name">${t.name}</div>`
      + (unlocked ? "" : `<div class="t-lock">🔒 ${t.cost}pt</div>`);
    if(unlocked) el.onclick = ()=>selectTheme(t.id);
    box.appendChild(el);
  });
}

// ポイント・レベル表示を更新
function renderStatus(){
  document.getElementById("pointCount").textContent = points;
  const info = levelOf(points);
  document.getElementById("lvEmoji").textContent = info.lv.emoji;
  document.getElementById("lvNum").textContent = "Lv." + (info.index+1);
  document.getElementById("lvName").textContent = info.lv.name;
  document.getElementById("lvPts").textContent = "🌸 " + points + " pt";
  const bar = document.getElementById("lvBar");
  const nextEl = document.getElementById("lvNext");
  if(info.next){
    const span = info.next.min - info.lv.min;
    const cur = points - info.lv.min;
    bar.style.width = Math.min(100, cur/span*100) + "%";
    nextEl.textContent = "つぎの「"+info.next.name+"」まで あと "+(info.next.min-points)+"pt";
  } else {
    bar.style.width = "100%";
    nextEl.textContent = "さいこうレベル！すごい！🎉";
  }
}

applyTheme(currentTheme);
renderStatus();
renderThemes();

function pick(arr, n){ // ランダムにn個
  const c = arr.slice();
  for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}
  return c.slice(0,n);
}
function shuffle(a){ return pick(a, a.length); }

// 各教科から1問つくる → {q, answer, choices[], exp}
function makeMath(){
  const t = Math.floor(Math.random()*3); // 0たし 1ひき 2かけ
  let a,b,q,ans,exp;
  if(t===0){ a=rnd(1,20); b=rnd(1,20); q=`${a} + ${b} = ?`; ans=a+b; exp=`${a} に ${b} をたすと ${ans}`; }
  else if(t===1){ a=rnd(1,20); b=rnd(1,a); q=`${a} − ${b} = ?`; ans=a-b; exp=`${a} から ${b} をひくと ${ans}`; }
  else { a=rnd(1,9); b=rnd(1,9); q=`${a} × ${b} = ?`; ans=a*b; exp=`${a} の ${b} こ分で ${ans}（${a}×${b}＝${ans}）`; }
  const set = new Set([ans]);
  while(set.size<4){ set.add(ans + rnd(-5,5)===ans ? ans+rnd(1,6) : ans+rnd(-6,6)); }
  const choices = shuffle([...set]).map(String);
  return {q, answer:String(ans), choices, exp};
}
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function makeFromPairs(pairs, promptFn){
  const [item] = pick(pairs,1);
  const q = promptFn(item);
  const ans = item[1];
  const wrongs = pick(pairs.filter(p=>p[1]!==ans),3).map(p=>p[1]);
  const choices = shuffle([ans,...wrongs]);
  return {q, answer:ans, choices, exp:item[2]||""};
}
function makeQuiz4(pool){
  const [item] = pick(pool,1);
  const q = item[0], ans = item[1];
  const choices = shuffle([ans, ...item[2]]);
  return {q, answer:ans, choices, exp:item[3]||""};
}

function genOne(subject){
  let s = subject;
  if(s==="mix"){ s = pick(["math","kanji","english","society","science"],1)[0]; }
  if(s==="math")    return makeMath();
  if(s==="kanji")   return makeFromPairs(KANJI_CLEAN, it=>`「${it[0]}」の読みは？`);
  if(s==="english") return makeFromPairs(ENGLISH, it=>`${it[0]} の いみは？`);
  if(s==="society") return makeQuiz4(SOCIETY);
  if(s==="science") return makeQuiz4(SCIENCE);
}

/* ===== 画面 ===== */
function show(id){
  ["home","quiz","end"].forEach(x=>document.getElementById(x).classList.toggle("hidden", x!==id));
  // ホーム以外の画面では「← ホーム」ボタンを出す
  document.getElementById("topBack").classList.toggle("hidden", id==="home");
}

function startQuiz(subject){
  // 同じ問題がダブらないように作る（問題文で重複チェック）
  quizList = [];
  const usedQ = new Set();
  let guard = 0;
  while(quizList.length < TOTAL && guard < 800){
    guard++;
    const item = genOne(subject);
    if(usedQ.has(item.q)) continue;   // すでに出た問題はスキップ
    usedQ.add(item.q);
    quizList.push(item);
  }
  idx = 0; gotThisSession = 0;
  pointStart = points;   // このクイズを始める前のポイントを覚えておく
  document.getElementById("quizTitle").textContent = SUBJECTS[subject].name;
  show("quiz");
  renderQuestion();
}

function renderQuestion(){
  const item = quizList[idx];
  document.getElementById("bar").style.width = (idx/TOTAL*100)+"%";
  document.getElementById("question").textContent = item.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("explain").classList.add("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
  const box = document.getElementById("choices");
  box.innerHTML = "";
  item.choices.forEach(c=>{
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = c;
    b.onclick = ()=>answer(b, c, item.answer);
    box.appendChild(b);
  });
}

function answer(btn, chosen, correct){
  const buttons = document.querySelectorAll(".choice");
  buttons.forEach(b=>b.onclick=null);
  // 1問こたえるごとに1ポイント（正解でも まちがえても）
  points++;
  localStorage.setItem("benkyo_points", points);
  // 右上のポイントを その場で更新（＋ピコッとアニメ）
  const pill = document.getElementById("points");
  document.getElementById("pointCount").textContent = points;
  pill.classList.remove("pop"); void pill.offsetWidth; pill.classList.add("pop");
  const fb = document.getElementById("feedback");
  if(chosen===correct){
    btn.classList.add("correct");
    fb.textContent = pick(["せいかい！🎉","すごい！✨","やったね！😊","ばっちり！👍"],1)[0];
    fb.className = "feedback fb-ok";
    gotThisSession++;
  } else {
    btn.classList.add("wrong");
    buttons.forEach(b=>{ if(b.textContent===correct) b.classList.add("correct"); });
    fb.textContent = "おしい！こたえは「"+correct+"」だよ😊";
    fb.className = "feedback fb-ng";
  }
  buttons.forEach(b=>{ if(!b.classList.contains("correct")&&!b.classList.contains("wrong")) b.classList.add("dim"); });
  // かいせつを出す（正解・まちがいどちらでも）
  const item = quizList[idx];
  if(item.exp){
    document.getElementById("explainText").textContent = item.exp;
    document.getElementById("explain").classList.remove("hidden");
  }
  document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQuestion(){
  idx++;
  if(idx>=TOTAL){ finish(); return; }
  renderQuestion();
}

function finish(){
  document.getElementById("bar").style.width = "100%";
  show("end");
  const e = document.getElementById("endEmoji");
  const m = document.getElementById("endMsg");
  if(gotThisSession>=8){ e.textContent="🏆"; m.textContent="よくできました！てんさい！"; }
  else if(gotThisSession>=5){ e.textContent="🎉"; m.textContent="がんばったね！すごい！"; }
  else { e.textContent="🌱"; m.textContent="よくちょうせんしたね！えらい！"; }

  const earned = points - pointStart;
  document.getElementById("endStars").textContent =
    "🌸 "+earned+"pt ゲット！（せいかい "+gotThisSession+"問）　ぜんぶで "+points+"pt";

  // レベルアップ・きせかえアンロックのお祝い
  const bonus = document.getElementById("endBonus");
  bonus.innerHTML = "";
  const beforeLv = levelOf(pointStart).index;
  const afterLv  = levelOf(points).index;
  if(afterLv > beforeLv){
    const info = levelOf(points);
    bonus.innerHTML += `<div class="bonus-box">🎊 レベルアップ！ <b>Lv.${afterLv+1}「${info.lv.name}」${info.lv.emoji}</b> になったよ！</div>`;
  }
  const newThemes = THEMES.filter(t=>t.cost>pointStart && t.cost<=points);
  newThemes.forEach(t=>{
    bonus.innerHTML += `<div class="bonus-box">🎨 あたらしいきせかえ <b>「${t.name}」</b> が つかえるよ！</div>`;
  });

  // ホーム画面の表示も新しいポイントに更新
  renderStatus();
  renderThemes();
}

function goHome(){ show("home"); }
